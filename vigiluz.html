<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGILUZ - Dashboard Maestro</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e27;
            --card: #1a1f3a;
            --accent: #00ff88; /* Verde Neón */
            --danger: #ff3366; /* Rojo */
            --text: #e8eaed;
            --border: #2d3250;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* ESTILO DEL ENCABEZADO UNIVERSAL */
        .universal-header {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .title-container h1 {
            font-family: 'Space Mono', monospace;
            font-size: 2rem;
            margin: 0;
            letter-spacing: 2px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .progress-track {
            height: 16px;
            background: #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            width: 0%; /* Se moverá con JavaScript */
            background: linear-gradient(90deg, var(--accent), #00ccff);
            box-shadow: 0 0 15px var(--accent);
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dates-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #8b949e;
            font-family: 'Space Mono', monospace;
        }

        .highlight { color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <header class="universal-header">
        <div class="title-container">
            <span style="font-size: 2rem;">⚡</span>
            <h1>VIGILUZ CONTROL</h1>
        </div>

        <div class="progress-info">
            <span>Progreso de Cumplimiento <small>(Basado en tareas verdes)</small></span>
            <span id="global-percent" class="highlight">0%</span>
        </div>

        <div class="progress-track">
            <div id="global-fill" class="progress-fill"></div>
        </div>

        <div class="dates-bar">
            <span>Inicio: <span class="highlight">04/Feb</span></span>
            <span id="time-status">Evaluando tiempo...</span>
            <span>Cierre: <span class="highlight">28/Feb</span></span>
        </div>
    </header>

    <div id="next-sections"></div>

</div>

</body>
</html>
