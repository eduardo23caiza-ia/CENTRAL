<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGILUZ - Centro de Control</title>
    <style>
        :root {
            --bg: #05070a;
            --card: #11141d;
            --accent: #00ff88; /* Verde Neón */
            --warning: #ffcc00; /* Amarillo Desarrollo */
            --danger: #ff3131; /* Rojo Pendiente */
            --text: #e8eaed;
        }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; }

        /* FORMULARIO DESPLEGABLE */
        #form-container {
            display: none; /* Oculto por defecto */
            background: var(--card);
            border: 1px solid #333;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        input, select { 
            width: 100%; padding: 10px; background: #000; border: 1px solid #333; 
            color: #fff; border-radius: 5px; box-sizing: border-box;
        }

        /* TARJETAS DE ACTIVIDAD */
        .activity-card {
            background: var(--card);
            border: 1px solid #222;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        /* LÓGICA DE SEMÁFOROS (Bordes) */
        .border-pendiente-roja { border-left: 5px solid var(--danger); box-shadow: -5px 0 10px rgba(255, 49, 49, 0.2); }
        .border-desarrollo-amarilla { border-left: 5px solid var(--warning); }
        .border-cumplida-verde { border-left: 5px solid var(--accent); }

        .btn-main {
            background: var(--accent); color: #000; border: none; padding: 10px 20px;
            border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>⚡ VIGILUZ: Panel Central</h1>
    
    <button class="btn-main" onclick="toggleForm()">+ Nueva Actividad</button>

    <div id="form-container">
        <div class="input-group">
            <label>Nombre de la Actividad</label>
            <input type="text" id="taskName" placeholder="Ej: A3. Costeo total">
        </div>
        <div style="display: flex; gap: 10px;">
            <div class="input-group" style="flex: 1;">
                <label>Inicio</label>
                <input type="date" id="startDate">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Final (Deadline)</label>
                <input type="date" id="endDate">
            </div>
        </div>
        <button class="btn-main" style="width: 100%;" onclick="addTask()">Guardar en Sistema</button>
    </div>

    <div id="taskList"></div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('vigiluz_tasks')) || [];

        function toggleForm() {
            const form = document.getElementById('form-container');
            form.style.display = form.style.display === 'block' ? 'none' : 'block';
        }

        function addTask() {
            const name = document.getElementById('taskName').value;
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;

            if(!name || !end) return alert("Completa el nombre y la fecha final");

            const newTask = {
                id: Date.now(),
                name: name,
                start: start,
                end: end,
                status: 'pendiente'
            };

            tasks.push(newTask);
            saveAndRender();
            toggleForm();
        }

        function deleteTask(id) {
            if(confirm("¿Seguro que quieres eliminar esta actividad?")) {
                tasks = tasks.filter(t => t.id !== id);
                saveAndRender();
            }
        }

        function updateStatus(id, newStatus) {
            const task = tasks.find(t => t.id === id);
            task.status = newStatus;
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('vigiluz_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];

            tasks.forEach(t => {
                // LÓGICA DE SEMÁFORO
                let statusClass = '';
                if(t.status === 'cumplida') statusClass = 'border-cumplida-verde';
                else if(t.status === 'desarrollo') statusClass = 'border-desarrollo-amarilla';
                else if(t.status === 'pendiente') {
                    statusClass = (today > t.end) ? 'border-pendiente-roja' : 'border-desarrollo-amarilla';
                }

                list.innerHTML += `
                    <div class="activity-card ${statusClass}">
                        <div>
                            <strong>${t.name}</strong><br>
                            <small style="color: #666;">🏁 Deadline: ${t.end}</small>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <select onchange="updateStatus(${t.id}, this.value)">
                                <option value="pendiente" ${t.status === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                                <option value="desarrollo" ${t.status === 'desarrollo' ? 'selected' : ''}>En desarrollo</option>
                                <option value="cumplida" ${t.status === 'cumplida' ? 'selected' : ''}>Cumplida</option>
                            </select>
                            <button onclick="deleteTask(${t.id})" style="background:none; border:none; color:red; cursor:pointer;">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        // Carga inicial
        renderTasks();
    </script>
</body>
</html>
