<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGILUZ - Core System</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Work+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a0e27;
            --secondary: #1a1f3a;
            --accent: #00ff88;
            --danger: #ff3366;
            --text: #e8eaed;
            --border: #2d3250;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--primary);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header h1 {
            font-family: 'Space Mono', monospace;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent);
        }

        /* LÍNEA DE TIEMPO DINÁMICA */
        .timeline-box {
            background: var(--secondary);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .track {
            height: 15px;
            background: #2d3250;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .fill {
            height: 100%;
            width: 0%; /* Se calcula con JS */
            transition: 0.5s;
            box-shadow: 0 0 15px currentColor;
        }

        /* TARJETAS DE MÉTRICAS */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--secondary);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ VIGILUZ: Dashboard</h1>
            <p>Sistema de Seguridad Solar - Validación MVP</p>
        </header>

        <div class="timeline-box">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span>Progreso Temporal</span>
                <span id="time-text">0%</span>
            </div>
            <div class="track">
                <div id="timeline-fill" class="fill" style="background: var(--accent); color: var(--accent);"></div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <small>TAREAS COMPLETADAS</small>
                <h2 id="tasks-count">0/15</h2>
            </div>
            <div class="card">
                <small>ESTADO</small>
                <h2 id="status-text" style="color: var(--danger);">CRÍTICO</h2>
            </div>
        </div>

        <a href="index.html" class="btn-back">⬅ VOLVER AL MAESTRO</a>
    </div>

    <script>
        // Lógica simple para simular datos
        const progress = 15; // Simulación de porcentaje
        document.getElementById('timeline-fill').style.width = progress + '%';
        document.getElementById('time-text').innerText = progress + '%';
        
        // Si el tiempo es mayor al progreso de tareas (ej. 15%), se pone rojo
        if(progress < 30) {
            document.getElementById('timeline-fill').style.background = 'var(--danger)';
            document.getElementById('timeline-fill').style.color = 'var(--danger)';
        }
    </script>
</body>
</html>
